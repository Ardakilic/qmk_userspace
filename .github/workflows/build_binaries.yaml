name: Build QMK firmware

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    name: 'QMK Userspace Build'
    uses: qmk/.github/.github/workflows/qmk_userspace_build.yml@main
    with:
      # Build against my fork: it has the keyboards that are not in upstream QMK
      # (cost_crafter40, skywatch, woodpecker, yakamoz). The keymaps come from this userspace.
      qmk_repo: Ardakilic/qmk_firmware
      qmk_ref: master

  publish:
    name: 'QMK Userspace Publish'
    uses: qmk/.github/.github/workflows/qmk_userspace_publish.yml@main
    # Only pushes to main replace the 'latest' release, and only when every target built: the build
    # job fails when any target fails, and the publisher deletes the old release first.
    # Other branches and manual runs just build.
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: build
